<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c28"><title>Smart Monitor | پیش‌نمایش</title>
<style>
:root{--bg:#080c28;--panel:#151b49;--panel2:#1d2459;--text:#f5f3ff;--muted:#b2b6d8;--purple:#9b45ff;--blue:#168bff;--cyan:#70dcff;--line:#343b79}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#28106a 0,transparent 38%),linear-gradient(145deg,#080c28,#10103a 55%,#070b22);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}.app{max-width:1440px;margin:auto;padding:18px;display:grid;grid-template-columns:270px 1fr;gap:18px;min-height:100vh}.side,.main{border:1px solid #3454c9;border-radius:26px;background:linear-gradient(160deg,#111a4dee,#080e2bee);box-shadow:0 0 30px #244cff44,inset 0 0 22px #6d39ff16}.side{padding:20px;display:flex;flex-direction:column;gap:11px}.brand{text-align:center;padding:12px 4px 18px}.logo{font-size:52px;filter:drop-shadow(0 0 16px #14cfff)}.brand h1{font-size:23px;margin:4px}.brand p,.muted{color:var(--muted);font-size:12px}.nav{display:flex;align-items:center;gap:12px;text-align:right;padding:12px 14px;border:1px solid #3b2e8c;background:linear-gradient(100deg,#23115c,#10265e);border-radius:16px;color:var(--text);cursor:pointer}.nav:hover,.nav.active{background:linear-gradient(100deg,#a600f7,#086cff);box-shadow:0 0 18px #752cff88}.nav .ico{font-size:21px;width:30px;text-align:center}.version{margin-top:auto;padding:15px;border-radius:18px;background:linear-gradient(120deg,#26105c,#0b4c91);color:#dce7ff}.main{padding:25px;overflow:hidden}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.top h2{font-size:25px;margin:0;flex:1}.tag{border:1px solid #6552c9;background:#21165a;padding:8px 12px;border-radius:20px;color:#d8d2ff;font-size:11px}.hero{border-radius:22px;padding:21px;background:radial-gradient(circle at 12% 20%,#a23bff77,transparent 25%),linear-gradient(110deg,#4d1aa7,#142d80 58%,#101746);margin-bottom:18px;display:flex;gap:14px;align-items:center}.hero .symbol{font-size:38px}.hero h3{margin:0 0 7px}.hero p{margin:0;color:#d9ddff;font-size:13px;line-height:1.8}.section{margin:20px 0 10px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{border:1px solid #5140a0;border-radius:19px;padding:17px;background:linear-gradient(160deg,#1b2257,#11183f);box-shadow:0 9px 22px #0003;min-width:0}.metric{font-size:27px;font-weight:bold;margin:8px 0}.muted{color:var(--muted);line-height:1.8}.approw{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #343b79}.approw:last-child{border:0}.appicon{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#4932a4,#1267a9);display:grid;place-items:center;font-size:23px}.copy{flex:1;min-width:0}.copy strong{display:block;font-size:14px}.copy small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.usage{font-size:12px;color:#c8d6ff;white-space:nowrap}.bar{height:7px;background:#303765;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#168bff,#c044ff);border-radius:9px}.btn{border:1px solid #6852d0;background:linear-gradient(100deg,#4c1a9e,#1253a5);color:white;border-radius:12px;padding:10px 14px;cursor:pointer}.btn.secondary{background:#24265e}.btn.warn{border-color:#a6537d;background:#502044}.switch{width:49px;height:27px;border:0;border-radius:30px;background:#41476c;padding:3px;cursor:pointer;flex-shrink:0}.switch:after{content:"";display:block;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:linear-gradient(90deg,#a100f7,#146dff)}.switch.on:after{transform:translateX(-22px)}.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #343b79}.row:last-child{border:0}.row .copy{flex:1}.field{background:#25236d;color:white;border:1px solid #6950c9;border-radius:11px;padding:10px;width:100%}.tablehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{font-size:11px;color:#aee9ff;border:1px solid #276a9c;background:#102e5a;border-radius:20px;padding:6px 10px}.notice{border:1px solid #9a6a32;background:#3b2a24;color:#ffe1b3;border-radius:14px;padding:12px;font-size:12px;line-height:1.9;margin-top:15px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{padding:16px;border:1px solid #5140a0;border-radius:17px;background:linear-gradient(145deg,#263b84,#111a47);cursor:pointer;color:white;text-align:right}.tile b{display:block;font-size:24px;margin-bottom:8px}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#25236d;border:1px solid #a878ff;border-radius:30px;padding:12px 20px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:850px){.app{grid-template-columns:1fr;padding:9px}.side{display:none}.main{padding:16px;border-radius:20px}.grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.top h2{font-size:21px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">💙</div><h1>Smart Monitor</h1><p>Live Better. Healthier. Smarter.</p></div><button class="nav active" data-page="home"><span class="ico">🏠</span>داشبورد</button><button class="nav" data-page="monitor"><span class="ico">📱</span>مانیتورینگ برنامه‌ها</button><button class="nav" data-page="health"><span class="ico">💗</span>سلامت و تغذیه</button><button class="nav" data-page="music"><span class="ico">🎵</span>موسیقی</button><button class="nav" data-page="language"><span class="ico">🎓</span>آموزش زبان</button><button class="nav" data-page="browser"><span class="ico">🌐</span>مرورگر</button><button class="nav" data-page="settings"><span class="ico">⚙️</span>تنظیمات</button><button class="nav" data-page="about"><span class="ico">ℹ️</span>درباره برنامه</button><div class="version">🚀 نسخه پیش‌نمایش وب<br><small>طرح نئون درخشان</small></div></aside><main class="main"><header class="top"><h2 id="title">داشبورد</h2><span class="tag">● پیش‌نمایش تعاملی</span></header><div id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const content=document.getElementById('content');let page='home';const apps=[{n:'اینستاگرام',i:'📸',t:'۱ ساعت و ۲۵ دقیقه',p:70,limit:120},{n:'تلگرام',i:'✈️',t:'۴۵ دقیقه',p:38,limit:60},{n:'یوتیوب',i:'▶️',t:'۲ ساعت و ۱۰ دقیقه',p:92,limit:90},{n:'کروم',i:'🌐',t:'۳۵ دقیقه',p:29,limit:90},{n:'بازی‌ها',i:'🎮',t:'۵۵ دقیقه',p:46,limit:60}];
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
function monitor(){return `<div class="hero"><span class="symbol">📱</span><div><h3>مرکز مانیتورینگ برنامه‌ها</h3><p>زمان استفاده، محدودیت روزانه و هشدار هر برنامه را جداگانه مدیریت کن. این بخش در نسخه وب صرفاً شبیه‌سازی است.</p></div></div><div class="grid"><div class="card"><span class="muted">مجموع زمان استفاده امروز</span><div class="metric">۵ ساعت و ۵۰ دقیقه</div><span class="pill">اطلاعات نمونه</span></div><div class="card"><span class="muted">برنامه‌های تحت نظارت</span><div class="metric">۵ برنامه</div><span class="pill">مدیریت مستقل هر برنامه</span></div></div><div class="section">📋 فهرست برنامه‌ها و میزان استفاده</div><section class="card"><div class="tablehead"><b>مانیتورینگ اختصاصی</b><button class="btn" onclick="toast('در نسخه اندروید، فهرست از برنامه‌های نصب‌شده خوانده می‌شود')">＋ افزودن برنامه</button></div>${apps.map((a,k)=>`<div class="approw"><div class="appicon">${a.i}</div><div class="copy"><strong>${a.n}</strong><small>محدودیت روزانه: <span id="lim${k}">${a.limit}</span> دقیقه</small><div class="bar"><i style="width:${a.p}%"></i></div></div><div class="usage">${a.t}</div><button class="btn secondary" onclick="editLimit(${k})">محدودیت</button><button class="switch on" aria-label="نظارت ${a.n}" onclick="this.classList.toggle('on');toast('وضعیت نظارت ${a.n} تغییر کرد')"></button></div>`).join('')}</section><div class="section">🔔 تنظیمات هشدار</div><section class="card"><div class="row"><div class="copy"><strong>هشدار نزدیک‌شدن به سقف استفاده</strong><small>مثلاً وقتی ۸۰٪ زمان مجاز مصرف شد</small></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div><div class="row"><div class="copy"><strong>هشدار عبور از محدودیت</strong><small>اعلان هنگام تمام‌شدن زمان مجاز هر برنامه</small></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div><div class="row"><div class="copy"><strong>گزارش روزانه استفاده</strong><small>خلاصه زمان مصرف برنامه‌ها</small></div><button class="switch" onclick="this.classList.toggle('on')"></button></div></section><div class="notice">نکته مهم: این پیش‌نمایش وب به آمار واقعی گوشی دسترسی ندارد. مانیتورینگ واقعی هر برنامه، تشخیص زمان استفاده و اعمال محدودیت باید در اپ اندروید با مجوزهای لازم (مانند Usage Access) پیاده‌سازی و روی دستگاه آزمایش شود.</div>`}
function editLimit(k){let v=prompt('محدودیت روزانه برای '+apps[k].n+' چند دقیقه باشد؟',apps[k].limit);if(v!==null&&Number(v)>0){apps[k].limit=Number(v);document.getElementById('lim'+k).textContent=v;toast('محدودیت نمونه ذخیره شد')}}
function render(){let titles={home:'داشبورد',monitor:'مانیتورینگ برنامه‌ها',health:'سلامت و تغذیه',music:'موسیقی',language:'آموزش زبان',browser:'مرورگر',settings:'تنظیمات',about:'درباره برنامه'};document.getElementById('title').textContent=titles[page];if(page==='monitor'){content.innerHTML=monitor();return}
let pages={
home:`<div class="hero"><span class="symbol">✨</span><div><h3>به Smart Monitor خوش آمدی</h3><p>از اینجا بخش‌های برنامه را مدیریت کن و وضعیت کلی را ببین.</p></div></div><div class="tiles"><button class="tile" onclick="go('monitor')"><b>📱</b>مانیتورینگ برنامه‌ها<small class="muted">کنترل زمان استفاده هر اپ</small></button><button class="tile" onclick="go('health')"><b>💗</b>سلامت و تغذیه</button><button class="tile" onclick="go('music')"><b>🎵</b>موسیقی</button><button class="tile" onclick="go('language')"><b>🎓</b>آموزش زبان</button><button class="tile" onclick="go('browser')"><b>🌐</b>مرورگر</button><button class="tile" onclick="go('settings')"><b>⚙️</b>تنظیمات</button></div><div class="section">📊 خلاصه امروز</div><div class="grid"><div class="card"><span class="muted">زمان استفاده از برنامه‌ها</span><div class="metric">۵:۵۰ ساعت</div><small class="muted">داده نمایشی — جزئیات در مانیتورینگ</small></div><div class="card"><span class="muted">وضعیت نظارت</span><div class="metric">فعال</div><small class="muted">نمونه رابط کاربری</small></div></div>`,
health:section('💗','سلامت و تغذیه','بخش ثبت فعالیت، برنامه ورزشی و اطلاعات تغذیه. در نسخه نهایی قابلیت‌های سلامت به داده‌های واقعی متصل می‌شوند.',['🏃 برنامه تمرینی','🥗 راهنمای تغذیه','📷 اسکن مواد غذایی']),
music:section('🎵','موسیقی','رابط نمونه پخش موسیقی و کنترل پخش. پخش واقعی فایل‌ها به نسخه اندروید وابسته است.',['▶️ پخش','⏸ توقف','⏭ آهنگ بعدی']),
language:section('🎓','آموزش زبان','بخش تمرین واژگان و یادگیری روزانه.',['📖 واژگان روز','🗣 تمرین تلفظ','✍️ آزمون کوتاه']),
browser:section('🌐','مرورگر','محیط نمونه مرورگر؛ در این پیش‌نمایش وب، مرور امن و دسترسی به سایت‌ها فعال نشده است.',['🔎 جست‌وجو','⭐ نشان‌شده‌ها','🕘 تاریخچه']),
settings:`<div class="hero"><span class="symbol">⚙️</span><div><h3>تنظیمات Smart Monitor</h3><p>تنظیمات نمایشی این پیش‌نمایش</p></div></div><section class="card"><div class="row"><div class="copy"><strong>انیمیشن‌ها</strong><small>جلوه‌های حرکتی رابط</small></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div><div class="row"><div class="copy"><strong>صرفه‌جویی در باتری</strong></div><button class="switch" onclick="this.classList.toggle('on')"></button></div><div class="row"><div class="copy"><strong>اعلان‌ها</strong></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div><div class="row"><div class="copy"><strong>زبان</strong></div><select class="field" style="width:auto"><option>فارسی</option><option>English</option></select></div></section>`,
about:`<div class="hero"><span class="symbol">💙</span><div><h3>Smart Monitor</h3><p>یک داشبورد یکپارچه برای پایش و مدیریت قابلیت‌های روزمره.</p></div></div><section class="card"><b>درباره این پیش‌نمایش</b><p class="muted">این نسخه برای نمایش ساختار صفحات و تعاملات ظاهری ساخته شده است. دسترسی‌های سیستمی و داده‌های واقعی فقط در اپ اندروید و پس از دریافت مجوز کاربر قابل استفاده‌اند.</p><span class="pill">نسخه وب نمایشی</span></section>`};content.innerHTML=pages[page]||''}
function section(icon,title,desc,items){return `<div class="hero"><span class="symbol">${icon}</span><div><h3>${title}</h3><p>${desc}</p></div></div><section class="card">${items.map(x=>`<div class="row"><div class="copy"><strong>${x}</strong></div><button class="btn secondary" onclick="toast('این قابلیت در پیش‌نمایش نمایشی است')">باز کردن</button></div>`).join('')}</section>`}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
</script></body></html>
